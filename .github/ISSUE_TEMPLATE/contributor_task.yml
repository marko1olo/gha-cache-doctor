name: Contributor task
description: Propose a small, well-bounded task for contributors.
title: "task: "
labels: ["help wanted", "up for grabs"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be improved?
    validations:
      required: true
  - type: textarea
    id: implementation
    attributes:
      label: Suggested implementation
      description: Mention files, tests, and docs that likely need updates.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete checks that should pass before a PR is ready.
      placeholder: |
        - Add focused tests.
        - Update docs if behavior changes.
        - `dotnet test GhaCacheDoctor.slnx` passes.
    validations:
      required: true
