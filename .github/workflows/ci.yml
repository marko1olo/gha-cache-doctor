name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build GhaCacheDoctor.slnx --configuration Release --no-restore

      - run: dotnet test GhaCacheDoctor.slnx --configuration Release --no-build

      - run: dotnet pack src/GhaCacheDoctor.Cli --configuration Release --no-build

      - run: dotnet run --project src/GhaCacheDoctor.Cli -- scan --path samples/github-actions/bad --fail-on none

      - run: dotnet run --project src/GhaCacheDoctor.Cli -- scan --path samples/github-actions/bad --format json --fail-on none
